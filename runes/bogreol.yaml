# Min Bogreol - personligt bogbibliotek som Yggdrasil-rune
# Alt (app + SQLite-database) ligger i serverens egen datamappe.
gameskill:
  id: bogreol
  name: "Min Bogreol"
  category: "Apps"
  description: "Personligt bogbibliotek: scan ISBN, hold styr paa koebte/laeste boeger og oenskeliste. Flere brugere, passkey-login og admin-styring. MCP-server til Claude. Egen SQLite-database - ingen eksterne afhaengigheder."
  author: "andreas"
  version: 16
  icon: "app"

  # Node-versionen er et FELT i panelet, ikke en konstant i koden: findes der en CVE
  # i Node, kan den lukkes med "Opdater Min Bogreol" - uden kodeaendring.
  docker:
    image: "{{NODE_IMAGE}}"

  variables:
    - key: APP_NAME
      name: "Appens navn"
      type: string
      default: "Min Bogreol"
    - key: NODE_IMAGE
      name: "Node-image"
      type: string
      default: "node:24-alpine"
      pattern: '^node:[0-9][A-Za-z0-9._-]*$'
      hint: "Skal vaere et node:-image, fx node:24-alpine eller node:24.9.0-alpine"

  install:
    image: "{{NODE_IMAGE}}"
    script: |
      set -eu
      echo "Installerer Min Bogreol v16 ..."

      # App-filerne ligger som brotli-komprimeret tar i base85 - se build_rune.py
      node -e 'const A=[];for(let c=33;c<127;c++){if(c!==96&&c!==123&&c!==125)A.push(c);}const M=new Map();for(let i=0;i<85;i++)M.set(A[i],i);const s=require("fs").readFileSync(0,"utf8").replace(/\s+/g,"");const o=[];for(let i=0;i<s.length;i+=5){const n=Math.min(5,s.length-i);let v=0;for(let j=0;j<5;j++){v=v*85+(j<n?M.get(s.charCodeAt(i+j)):84);}const b=[(v/16777216)&255,(v/65536)&255,(v/256)&255,v&255];for(let j=0;j<n-1;j++)o.push(b[j]);}process.stdout.write(require("zlib").brotliDecompressSync(Buffer.from(o)));' <<'YGG_PAYLOAD_EOF' | tar x
