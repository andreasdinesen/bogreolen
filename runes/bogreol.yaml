  # Egen "Opdater Min Bogreol"-knap paa serversiden i panelet: skriver app-filerne igen
  # uden at roere datamappen. `rm -rf app` foerst, saa filer der er FJERNET i en ny
  # version ogsaa forsvinder. Databasen (bogreol.db) ligger uden for app/.
  update:
    image: "{{NODE_IMAGE}}"
    label: "Opdater Min Bogreol"
    script: |
      set -eu
      echo "Opdaterer Min Bogreol til v16 ..."
      echo "Node: $(node --version)"

      rm -rf app

      # Samme brotli+base85-payload som install - se build_rune.py
      node -e 'const A=[];for(let c=33;c<127;c++){if(c!==96&&c!==123&&c!==125)A.push(c);}const M=new Map();for(let i=0;i<85;i++)M.set(A[i],i);const s=require("fs").readFileSync(0,"utf8").replace(/\s+/g,"");const o=[];for(let i=0;i<s.length;i+=5){const n=Math.min(5,s.length-i);let v=0;for(let j=0;j<5;j++){v=v*85+(j<n?M.get(s.charCodeAt(i+j)):84);}const b=[(v/16777216)&255,(v/65536)&255,(v/256)&255,v&255];for(let j=0;j<n-1;j++)o.push(b[j]);}process.stdout.write(require("zlib").brotliDecompressSync(Buffer.from(o)));' <<'YGG_PAYLOAD_EOF' | tar x
